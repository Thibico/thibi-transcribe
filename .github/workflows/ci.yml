name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # Postgres and MinIO, matching infra/compose.dev.yml. Without them the constraint
    # suite and the S3 half of the storage contract skip themselves — and those cover
    # exactly what a mock cannot: partial unique indexes, CHECK constraints, COPY escaping
    # and presigned URLs. A suite that silently skips is worse than one that is absent.
    #
    # MinIO is not here but in a step below, because a service container cannot override
    # the image command and `minio/minio` needs `server /data`. See that step.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: thibi
          POSTGRES_PASSWORD: thibi
          POSTGRES_DB: thibi
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U thibi -d thibi"
          --health-interval 3s --health-timeout 3s --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://thibi:thibi@localhost:5433/thibi
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_BUCKET: thibi
      TEST_S3_ACCESS_KEY_ID: thibi
      TEST_S3_SECRET_ACCESS_KEY: thibi-dev-secret

    steps:
      - uses: actions/checkout@v5

      # `bitnami/minio:latest` was a service container until 2026-08-10, when every run
      # began dying at container init with `manifest unknown` — before a single test ran.
      # Not a flake: Bitnami emptied its free Docker Hub catalog in August 2025 and moved
      # the images to `bitnamilegacy/`, frozen at 2025-08-19. That tag cannot come back.
      #
      # The replacement is the image infra/compose.dev.yml already uses, which also stops
      # CI and dev drifting apart. It cannot be a service container: those accept `options`
      # (docker run flags) but no command, and `minio/minio` exits printing help unless it
      # is given `server /data`. Bitnami's image started a server unprompted, which is the
      # only reason the service-container shape worked here in the first place.
      - name: Start MinIO
        run: |
          docker network create thibi-ci
          docker run -d --name minio --network thibi-ci -p 9000:9000 \
            -e MINIO_ROOT_USER=thibi \
            -e MINIO_ROOT_PASSWORD=thibi-dev-secret \
            minio/minio:latest server /data

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/ready >/dev/null 2>&1; then
              echo "minio ready after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::MinIO did not become ready in 60s."
              docker logs minio
              exit 1
            fi
            sleep 2
          done

          # TEST_S3_BUCKET has to exist before the storage contract runs: nothing in the
          # suite creates it, and it used to arrive via bitnami's MINIO_DEFAULT_BUCKETS,
          # which is a Bitnami extension the official image does not have. This mirrors
          # the minio-init one-shot in infra/compose.dev.yml.
          # Reached by container name on a user-defined network rather than via
          # `--network host`, which is Linux-only — this way the same commands can be run
          # on a laptop to check a change to this step before pushing it.
          docker run --rm --network thibi-ci --entrypoint sh minio/mc:latest -c "
            mc alias set local http://minio:9000 thibi thibi-dev-secret &&
            mc mb --ignore-existing local/thibi
          "

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The generated registry is committed so `next dev` and `tsc` work with no prior
      # build. This is the guard that it still matches data/*.json.
      - name: Registry drift
        run: |
          pnpm gen
          git diff --exit-code packages/languages/src/generated

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # The database-backed suites skip themselves when Postgres is unreachable, which is
      # right for a laptop with no Docker and wrong for CI. Assert they actually ran.
      - name: Database-backed tests were not skipped
        run: |
          if pnpm exec vitest run --project @thibi/db --reporter=json 2>/dev/null \
             | grep -q '"status":"skipped"'; then
            echo "::error::The @thibi/db suite skipped — Postgres was not reachable in CI."
            exit 1
          fi

      # Second line of defence behind the no-restricted-properties rule: an
      # `eslint-disable` comment would be enough to slip process.env back into the engine,
      # and a grep is not disable-able.
      #
      # Comment lines are stripped first. The rules are worth explaining where they are
      # enforced, and a check that forbids naming the thing it forbids would delete its own
      # documentation — including the record of exactly which false claim was removed.
      - name: Engine reads no ambient configuration
        run: |
          hits=$(grep -rn 'process\.env\|process\.cwd\|__dirname' packages/*/src \
                   --include='*.ts' \
                 | grep -v '__tests__' \
                 | grep -vE ':[[:space:]]*(\*|//|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::The engine reads no ambient configuration — take it from EngineContext."
            exit 1
          fi

      # The old app justified pinning a Google region with a doctrine measured false twice
      # (2026-07-30 probe and 2026-08-09 spike S3 both got correct output from all three
      # regions). It lived in four places: a provider comment, an error hint, a settings
      # default's justification and a settings-page hint. The region *value* is a fine
      # default; the claim that it is forced is not, and it must not reappear as a comment
      # or an error message. One file may name it, and it is named here.
      #
      # That file was `apps/cli/src/config.ts` until the worker also had to build a context
      # and passed `region: 'asia-southeast1'` inline — which failed this check on `main`.
      # The check was right: the constants moved to `@thibi/runtime`, the composition root
      # both apps already share, so there is no longer anywhere else to put a second copy.
      - name: No region doctrine
        run: |
          hits=$(grep -rn 'asia-southeast1' packages/*/src apps/*/src 2>/dev/null \
                 | grep -v '^apps/runtime/src/config.ts:' \
                 | grep -v '__tests__' \
                 | grep -vE ':[[:space:]]*(\*|//|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Region is a free choice — see .env.example. apps/cli/src/config.ts is its only home in source."
            exit 1
          fi

# Deliberately absent: `thibi probe languages`. It calls paid provider APIs, so freshness
# is a documented quarterly task plus the probedAt dates being visible in
# /settings/languages — not something CI does on every push.
